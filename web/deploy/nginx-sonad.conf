# Add to /home/fedor/bevy_md_sim/nginx/nginx.conf on the droplet.

server {
    listen 80;
    server_name sonad.fedor.ee;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name sonad.fedor.ee;

    ssl_certificate /etc/letsencrypt/live/sonad.fedor.ee/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sonad.fedor.ee/privkey.pem;
    root /var/www/sonad.fedor.ee;

    gzip on;
    gzip_types text/html text/css application/javascript application/json;

    location / {
        # One self-contained index.html; always revalidate so deploys show up at once.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
